# Unit tests and translation-data checks. Needs node and jq, both preinstalled
# on the runner; the plugin itself is never installed here, so nothing in the
# job touches a real Omarchy.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Unit tests
        run: test/model-test.sh

      - name: Translation data
        run: tools/check-translations.sh

      - name: Shell syntax
        run: |
          for script in setup menu-language menu-translate tools/*.sh test/*.sh; do
            bash -n "$script"
          done
